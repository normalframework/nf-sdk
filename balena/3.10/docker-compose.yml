version: "2.1"

volumes:
  redis-db:
  nf-var:
  netcfg-data:

services:
  redis:
    image: normalframework.azurecr.io/normalframework/redis:3.10.9-1
    ports:
      - "6379:6379"
    volumes:
      - "redis-db:/data"

  nf:
    image: normalframework.azurecr.io/normalframework/nf-full:3.10.9-1
    network_mode: host
    privileged: true
    environment:
      - PORT=80
      #   uncomment these to enable support for the bluetooth configuration app
      - NWCONFIG_ENABLED=true
      #   this variable sets how long after device boot the Normal
      #   Connect configuration service is available.  For security,
      #   it's best not to leave it active forever.
      - NWCONFIG_BLE_TIMEOUT=0s
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
    labels:
      # required to get balena device name
      io.balena.features.supervisor-api: '1'
      # needed for nwconfig / bluetooth 
      io.balena.features.dbus: '1'
    depends_on:
      - redis
    volumes:
      - "nf-var:/var/nf"

  # Network and proxy configuration console (netcfgd). Web UI on
  # http://<device-ip>:8081, admin / normal (forces a change on first
  # sign-in). See balena/network-config/README.md.
  network-config:
    image: normal.azurecr.io/normalframework/netcfgd:0.1.8
    # host networking: it configures the host's interfaces, and its probes
    # must leave by the same path the host uses.  8081 avoids nf's PORT=80.
    network_mode: host
    cap_add:
      # NET_ADMIN for interface state, NET_RAW for ping / traceroute
      - NET_ADMIN
      - NET_RAW
    environment:
      # required, or it talks to the container's own bus and finds no interfaces
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
      - NETCFG_LISTEN=:8081
      # changes are allowed.  Set NETCFG_READONLY=1 (e.g. as a balena
      # device variable) to keep the diagnostics but block every change.
    labels:
      # same labels nf already has: dbus reaches NetworkManager,
      # supervisor-api reaches the proxy / host-config settings
      io.balena.features.dbus: '1'
      io.balena.features.supervisor-api: '1'
    volumes:
      # watchdog state; losing it re-applies the proxy on next start,
      # which restarts every container on the device
      - "netcfg-data:/data"

