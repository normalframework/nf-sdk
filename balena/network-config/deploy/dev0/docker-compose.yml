# Normal Framework 3.10.8 plus the network configuration console.
#
# Push from this directory:
#   balena push <fleet> --source .
#
# The console is then on port 8081 of the device's LAN address, signing in with
# admin / normal, which it forces you to change.

version: "2.1"

volumes:
  redis-db:
  nf-var:
  netcfg-data:

services:
  redis:
    image: normalframework.azurecr.io/normalframework/redis:3.10.8-0
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - "redis-db:/data"

  nf:
    image: normalframework.azurecr.io/normalframework/nf-full:3.10.8-0
    restart: always
    network_mode: host
    privileged: true
    environment:
      - PORT=80
      - NWCONFIG_ENABLED=true
      # 0s leaves the Normal Connect config service available indefinitely.
      # Shorten it once a site is commissioned.
      - NWCONFIG_BLE_TIMEOUT=0s
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
    labels:
      io.balena.features.supervisor-api: '1'
      io.balena.features.dbus: '1'
    depends_on:
      - redis
    volumes:
      - "nf-var:/var/nf"

  network-config:
    image: nfdev.azurecr.io/normalframework/netcfgd:0.1.8
    restart: always
    # Host networking: the console configures the host's interfaces, and its
    # probes have to leave by the same path the host uses. Port 8081 keeps out
    # of the way of nf's PORT=80, which is on the same network namespace.
    network_mode: host
    cap_add:
      # NET_ADMIN for interface state, NET_RAW for ICMP in ping and traceroute.
      # Neither needs the container to be privileged.
      - NET_ADMIN
      - NET_RAW
    environment:
      # Without this the D-Bus client talks to the container's own bus rather
      # than the host's, and finds no interfaces.
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
      - NETCFG_LISTEN=:8081
      # Read-only keeps every diagnostic and disables every change: no proxy
      # can be applied, no interface reconfigured, no containers restarted.
      # The right setting wherever the network already works. Remove it only
      # while actively reconfiguring a site.
      - NETCFG_READONLY=1
    labels:
      # Same two labels nf already has, so this grants nothing new at the fleet
      # level: dbus reaches NetworkManager, supervisor-api reaches the proxy.
      io.balena.features.dbus: '1'
      io.balena.features.supervisor-api: '1'
    volumes:
      # Holds the watchdog's record of what it has already applied. Lose this
      # and it re-applies the proxy on next start, restarting every container.
      - netcfg-data:/data
