# Stock Dante SOCKS5 server, no authentication, no destination restrictions.
# This is the permissive case: anything that fails through here is a fault in
# the client, not in proxy policy.

internal: 0.0.0.0 port = 1080
external: eth0

socksmethod: none
clientmethod: none
user.privileged: root
user.unprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect disconnect error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect disconnect error
}
