# A deliberately ordinary corporate Squid: no authentication, and CONNECT
# allowed only to 443.
#
# That last part is not an artificial restriction — it is Squid's stock
# Safe_ports/SSL_ports policy, and it is why Cloudflare Tunnel fails on so many
# customer networks: cloudflared needs CONNECT to port 7844, which this config
# refuses. Testing against it reproduces the real failure rather than a
# convenient one.

http_port 3128
visible_hostname test-proxy-open

acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 21
acl Safe_ports port 443
acl Safe_ports port 70
acl Safe_ports port 210
acl Safe_ports port 1025-65535
acl Safe_ports port 280
acl Safe_ports port 488
acl Safe_ports port 591
acl Safe_ports port 777
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localnet
http_access allow localhost
http_access deny all

# Squid drops privileges to the "proxy" user, which cannot open /dev/stdout,
# so logs stay in the image default location: docker compose exec squid-open \
# tail -f /var/log/squid/access.log
access_log daemon:/var/log/squid/access.log
cache deny all
