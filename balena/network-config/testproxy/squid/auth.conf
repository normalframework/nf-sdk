# The same Squid with two differences: it requires basic authentication, and it
# permits CONNECT to 7844 as well as 443 — the configuration a network
# administrator ends up with after being asked to allow Cloudflare Tunnel.
#
# Testing against both proxies shows the console distinguishing "your password
# is wrong" from "this destination is blocked by policy".

http_port 3128
visible_hostname test-proxy-auth

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic children 5
auth_param basic realm corp-proxy
auth_param basic credentialsttl 1 minute

acl authenticated proxy_auth REQUIRED

acl SSL_ports port 443
acl SSL_ports port 7844
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 7844
acl Safe_ports port 1025-65535
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow authenticated
http_access deny all

# Squid drops privileges to the "proxy" user, which cannot open /dev/stdout,
# so logs stay in the image default location: docker compose exec squid-open \
# tail -f /var/log/squid/access.log
access_log daemon:/var/log/squid/access.log
cache deny all
